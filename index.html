<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberNet</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/paneles.js" defer></script>
</head>

<body>
    <header>
        <h1>CyberNet</h1>
        <h4>Sistema de gestión del cibercafé</h4>
    </header>

    <main>
        <section>
            <h2>Bienvenido</h2>
        </section>
        <div class="login-card">
            
            <h2>Inicio Sesion</h2>
            <form id="form-login" action="" method="post">
            
            <div class="form-group">    
            <label for="correo">Correo electronico:</label>
            <input type="email" id="correo" name="correo" required>
            </div>
            
            <div class="form-group">
            <label for="password">Contraseña: </label>
            <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="button-login">Iniciar Sesion</button>
            </form>
        </div>
    </main>

    <footer>
        <p>©2026 CyberNet. Todos los derechos reservados.</p>
        <p>Soporte: soporte@cybernet.com</p>
        <p>Contacto: +56 9 1234 5678</p>
    </footer>
</body>
</html>
